# Limites de temperatura (°C) usados pelo temp-guard (aviso) e pelo MyBar
# (cor no Monitor: amarelo a 10° do limite, vermelho no limite).
cpu=90    # Ryzen 7600X: limite de projeto 95
gpu=100   # RX 9060 XT, junção: crítico 110
vram=95   # crítico 108
ssd=75    # o NV3 reduz a velocidade perto de 80
